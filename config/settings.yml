# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

use_default_settings: true

server:
  image_proxy: true
  limiter: false

search:
  safe_search: 0
  limit_im_any_language: true
  formats:
    - html
    - json

engines:
  # Focus heavily on developer platforms
  - name: google
    engine: google
    shortcut: go
    categories: general
    timeout: 3.0
  - name: github
    engine: github
    shortcut: gh
    categories: [IT]
    timeout: 4.0
  - name: stackexchange
    engine: stackexchange
    shortcut: so
    categories: [general, IT]
    timeout: 3.0
  - name: arch linux
    engine: archlinux
    shortcut: aarch
    categories: [IT]
    timeout: 2.0
  - name: wikipedia
    engine: wikipedia
    shortcut: w
    categories: [general, encyclopedias]
    timeout: 2.0
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: [general]
    timeout: 2.5
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    categories: [general]
    timeout: 2.5
    disabled: false
  - name: huggingface
    engine: huggingface
    shortcut: hf
    categories: [IT, AI, LLM]
    timeout: 2.5
    disabled: false

# Drop heavy UI elements & cookies since an AI agent is reading it
ui:
  static_use_hash: true
  default_locale: "en"

# Aggressive timeout management to prevent the agent from hanging
outgoing:
  request_timeout: 4.0
  max_request_timeout: 5.0
  useragent_suffix: "SX/1.0 (https://github.com/searxng/searxng)"
